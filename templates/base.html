<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HelpDesk{% endblock %} · Gestión de incidencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'incidencias:lista' %}">HelpDesk</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{% url 'incidencias:lista' %}">Incidencias</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'incidencias:nueva' %}">Nueva</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        {{ message }}
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-secondary small">
    MF0227_3 · Sistema de Gestión de Incidencias Técnicas
  </footer>
</body>
</html>
